global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets:
        - prometheus:9090

  - job_name: 'uptime-sentinel-backend'
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets:
        - backend:8000

  - job_name: 'uptime-sentinel-worker'
    dns_sd_configs:
      - names:
          - worker
        type: A
        port: 9000
        refresh_interval: 10s
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: uptime-sentinel-backend
  namespace: uptime-sentinel
  labels:
    app.kubernetes.io/name: uptime-sentinel
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: uptime-sentinel
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: uptime-sentinel
      app.kubernetes.io/component: backend
      app.kubernetes.io/part-of: uptime-sentinel
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      
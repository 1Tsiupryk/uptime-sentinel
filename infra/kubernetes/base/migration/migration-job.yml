apiVersion: batch/v1
kind: Job
metadata:
  name: migration-job
  labels:
    app.kubernetes.io/name: uptime-sentinel
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: uptime-sentinel
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3

  template:
    metadata:
      labels:
        app.kubernetes.io/name: uptime-sentinel
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: uptime-sentinel
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: migrate
          image: uptime-sentinel-backend
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true

          command:
            - python
            - -m
            - alembic
            - upgrade
            - head
          envFrom:
            - configMapRef:
                name: uptime-sentinel-config
            - secretRef:
                name: postgres-credentials
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

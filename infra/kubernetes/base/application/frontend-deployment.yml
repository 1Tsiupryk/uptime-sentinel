apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: uptime-sentinel
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: uptime-sentinel
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: uptime-sentinel
      app.kubernetes.io/component: frontend
      app.kubernetes.io/part-of: uptime-sentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uptime-sentinel
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: uptime-sentinel
    spec:
      restartPolicy: Always
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: frontend
          image: uptime-sentinel-frontend
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

      volumes:
        - name: tmp-volume
          emptyDir: {}

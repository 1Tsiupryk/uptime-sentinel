apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: uptime-sentinel
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: uptime-sentinel
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: uptime-sentinel
      app.kubernetes.io/component: backend
      app.kubernetes.io/part-of: uptime-sentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uptime-sentinel
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: uptime-sentinel
    spec:
      restartPolicy: Always
      automountServiceAccountToken: false

      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001

      containers:
        - name: backend
          image: uptime-sentinel-backend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

          envFrom:
            - configMapRef:
                name: uptime-sentinel-config
            - secretRef:
                name: postgres-credentials

          command:
            - python
            - -m
            - uvicorn
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

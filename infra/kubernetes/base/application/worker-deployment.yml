apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: uptime-sentinel
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: uptime-sentinel
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: uptime-sentinel
      app.kubernetes.io/component: worker
      app.kubernetes.io/part-of: uptime-sentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uptime-sentinel
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: uptime-sentinel
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: "/metrics"
    spec:
      restartPolicy: Always
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 70
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: worker
          image: uptime-sentinel-backend
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: metrics
              containerPort: 9000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: uptime-sentinel-config
            - secretRef:
                name: postgres-credentials
          command:
            - python
            - -m
            - app.worker.run
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

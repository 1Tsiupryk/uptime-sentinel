apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitor-check-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: uptime-sentinel
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - worker
          - backend
  policyTypes: [Egress]
  egress:
    - to:
      - ipBlock:
          cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-backend-metrics
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: uptime-sentinel
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-worker-metrics
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: uptime-sentinel
      app.kubernetes.io/component: worker
  policyTypes:
    - Ingress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9000

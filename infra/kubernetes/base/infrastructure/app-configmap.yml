apiVersion: v1
kind: ConfigMap
metadata:
  name: uptime-sentinel-config
  labels:
    app.kubernetes.io/name: uptime-sentinel
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: uptime-sentinel
data:
  PROJECT_NAME: "Uptime Sentinel"
  ENVIRONMENT: "local"

  POSTGRES_SERVER: "postgres"
  POSTGRES_PORT: "5432"
   
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_SOCKET_TIMEOUT_SECONDS: "2"
  REDIS_LOCK_TIMEOUT_SECONDS: "90"

  WORKER_POLL_INTERVAL_SECONDS: "5"
  WORKER_METRICS_PORT: "9000"

  CORS_ALLOWED_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'

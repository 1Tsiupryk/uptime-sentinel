apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: uptime-sentinel
spec:
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: uptime-sentinel
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: redis
  type: ClusterIP

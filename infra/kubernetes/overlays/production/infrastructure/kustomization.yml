apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: uptime-sentinel

resources:
  - ../../../base/infrastructure

patches:
  - path: app-configmap-patch.yml

secretGenerator:
  - name: postgres-credentials
    envs:
      - .env

generatorOptions:
  disableNameSuffixHash: true

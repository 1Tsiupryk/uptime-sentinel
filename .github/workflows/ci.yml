name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      PROJECT_NAME: uptime-sentinel
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: uptime_sentinel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest

  frontend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    strategy:
      matrix:
        include:
          - image: frontend
            context: ./frontend

          - image: backend
            context: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: false
          tags: uptime-sentinel-${{ matrix.image }}:ci

  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare test .env
        run: cp infra/docker/.env.example infra/docker/.env

      - name: Validate Compose configuration
        run: docker compose -f infra/docker/docker-compose.yml config --quiet

  kubernetes-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.37.0'

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: 'v4.3.0'

      - name: Validate deploy scripts
        run: |
          bash -n scripts/deploy-local.sh
          bash -n scripts/deploy-monitoring.sh

      - name: Prepare test .env
        run: cp infra/kubernetes/overlays/local/infrastructure/.env.example infra/kubernetes/overlays/local/infrastructure/.env

      - name: Validate Kustomize configuration
        run: |
          kubectl kustomize infra/kubernetes/base/infrastructure >/dev/null
          kubectl kustomize infra/kubernetes/base/migration >/dev/null
          kubectl kustomize infra/kubernetes/base/application >/dev/null
          kubectl kustomize infra/kubernetes/overlays/local/infrastructure >/dev/null
          kubectl kustomize infra/kubernetes/overlays/local/migration >/dev/null
          kubectl kustomize infra/kubernetes/overlays/local/application >/dev/null
          kubectl kustomize infra/kubernetes/monitoring >/dev/null
          kubectl kustomize infra/grafana/dashboards >/dev/null

      - name: Validate Traefik values
        run: |
          helm repo add traefik https://traefik.github.io/charts
          helm template traefik traefik/traefik \
            --version 41.5.0 \
            --namespace traefik \
            --values infra/kubernetes/traefik/values.yml \
            >/dev/null

      - name: Validate monitoring values
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm template monitoring prometheus-community/kube-prometheus-stack \
            --version 88.0.1 \
            --namespace monitoring \
            --values infra/kubernetes/monitoring/values.yml \
            >/dev/null
